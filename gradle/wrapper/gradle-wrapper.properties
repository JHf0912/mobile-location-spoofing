# Served from a mirror: services.gradle.org is effectively unreachable from mainland China
# (~90 KB/s, timing out). The mirror hosts the byte-identical official artifact, and
# distributionSha256Sum below was fetched from services.gradle.org — so a tampered or
# mismatched download fails loudly rather than being silently used.
#
# Contributors outside mainland China can switch this back to the official URL:
#   distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip
distributionSha256Sum=b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06
# 10s is too tight for a ~130 MiB distribution on a slow link.
networkTimeout=60000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
