# Gradle version catalog — the single source of truth for dependency and plugin versions.
# Referenced from build files as `libs.*` (e.g. libs.androidx.core.ktx, libs.plugins.kotlin.android).
#
# ⚠️ Step 1A of the toolchain migration: AGP/Gradle/Kotlin are on the new (AGP 9) line, while the
# AndroidX libraries are deliberately still pinned to the compileSdk 36 era. That keeps the build
# tooling change and the dependency upgrade separately attributable if something breaks.
# Step 1B raises compileSdk to 37 and takes the AndroidX libraries to current.
#
# Constraints that are easy to get wrong:
#  - AGP 9.2.0 has a known R8 `ClassNotFoundException: com.android.tools.r8.RecordTag` → use 9.2.1.
#  - AGP 9.2 requires Gradle 9.4.1 (minimum = default) and JDK 17+.
#  - KSP moved to an independent version scheme: 2.3.x, no longer "<kotlin>-<ksp>".

[versions]
agp = "9.2.1"
# AGP 9 has built-in Kotlin: it brings its own KGP (2.3.10 for AGP 9.2) and the
# `org.jetbrains.kotlin.android` plugin must NOT be applied. This `kotlin` version therefore only
# versions the Compose compiler plugin, which AGP does not take over — and it must match the KGP
# that AGP bundles, or the two disagree about the compiler version.
kotlin = "2.3.10"
ksp = "2.3.12"

# AndroidX — compileSdk 36 era (step 1A)
coreKtx = "1.17.0"
lifecycle = "2.9.4"
activityCompose = "1.12.4"
composeBom = "2025.11.01"
material = "1.12.0"
room = "2.7.2"

# Google Play services
playServicesLocation = "21.3.0"

# Third-party
amap3dmap = "10.0.600"

# Kotlin ecosystem
coroutines = "1.10.2"
turbine = "1.2.1"

# Test
junit = "4.13.2"

[libraries]
# AndroidX core & lifecycle
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# Compose — versions come from the BOM, never pinned individually.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
google-android-material = { module = "com.google.android.material:material", version.ref = "material" }

# Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# Play services
google-play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }

# Maps
# Alias is `amap-maps` rather than `amap-3dmap`: catalog segments must start with a letter,
# so a `3dmap` segment cannot generate a valid Kotlin accessor.
amap-maps = { module = "com.amap.api:3dmap", version.ref = "amap3dmap" }

# Kotlin ecosystem
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Test
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# NOTE: there is deliberately no `org.jetbrains.kotlin.android` plugin here. Since AGP 9.0 that
# plugin is no longer required — applying it fails with "The 'org.jetbrains.kotlin.android' plugin
# is no longer required for Kotlin support since AGP 9.0." AGP compiles Kotlin itself.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
