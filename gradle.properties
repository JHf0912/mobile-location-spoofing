# The Kotlin/AGP toolchain needs considerably more than the default 512 MiB heap and
# 384 MiB metaspace; the stock values ran the daemon out of metaspace on a clean build.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.1.0 was tested up to compileSdk 36.1, so it warns about the project's 37.0.
#
# The warning is suppressed rather than resolved, and that is a deliberate trade:
#   - compileSdk 37 is mandatory — Compose 1.12 (BOM 2026.09.00) enforces it through AAR
#     metadata, so dropping to 36.1 would mean reverting the whole AndroidX stack by ~10 months.
#   - AGP 9.1.1 is the release that officially supports API 37.0, but Android Studio 2025.3
#     refuses to import anything above AGP 9.1.0.
# The build is verified working on this combination (tests and APK). Remove this line once
# Android Studio is new enough to take AGP 9.1.1 or newer.
android.suppressUnsupportedCompileSdk=37.0

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
