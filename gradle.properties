# The Kotlin/AGP toolchain needs considerably more than the default 512 MiB heap and
# 384 MiB metaspace; the stock values ran the daemon out of metaspace on a clean build.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
