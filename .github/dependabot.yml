version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Compose artifacts are versioned by the BOM, so the BOM must move with them or the
      # resolution silently disagrees.
      androidx-compose:
        patterns:
          - "androidx.compose*"
      # Kotlin, KSP and the Compose compiler plugin are version-locked to each other and to AGP;
      # upgrading them one at a time produces builds that cannot resolve.
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
